; Hexapod MK3 – Firmware (ESP32-S3-CAM, N16R8)
;
; Build:   pio run
; Flash:   pio run -t upload        (USB-C Buchse "TTL" / CH340)
; Monitor: pio device monitor
;
; Plattform: pioarduino (Arduino-Core 3.x auf ESP-IDF 5.x). Version ist fest
; gepinnt, damit Builds reproduzierbar bleiben.

[platformio]
default_envs = hexapod

[env:hexapod]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N16R8: 16 MB Quad-Flash, 8 MB Octal-PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    ; Serial läuft über den CH340 (Buchse "TTL"), nicht über natives USB
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1

; Firmware über WLAN aufspielen (Roboter im selben Netz, ArduinoOTA):
;   pio run -e hexapod_ota -t upload
; bzw. in VS Code unten die Umgebung "hexapod_ota" wählen und Upload. Ohne mDNS
; (z. B. manche Windows-PCs) upload_port auf die IP aus der Oberfläche setzen.
; Vor jedem Build: Versionsangaben nach src/generated/version.h (Datei VERSION +
; Git-Stand), web/* als gzip nach src/generated/web_assets.h
extra_scripts =
    pre:scripts/version.py
    pre:scripts/embed_web.py

[env:hexapod_ota]
extends = env:hexapod
upload_protocol = espota
upload_port = hexapod.local
; mit OTA_PASSWORD in include/secrets.h:
; upload_flags = --auth=dein-passwort
