<text x="75.00" y="244.00" font-size="2.4" text-anchor="end" fill="#666" font-weight="normal" >parallel zur Längsachse</text>
<text x="59.40" y="200.40" font-size="2.6" text-anchor="start" fill="#d0453f" font-weight="bold" >Eckbeine 45°</text>
