<text x="92.00" y="182.00" font-size="3.4" text-anchor="start" fill="#222" font-weight="bold" >So geht's</text>
<text x="92.00" y="188.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >1.</text>
<text x="97.00" y="188.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Roboter aufbocken: Femur-Achsen 52 mm über dem Tisch (Chassis-</text>
<text x="92.00" y="192.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="192.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Unterkante ca. 28 mm). Kalibrierung: Torque an, „Alle auf 1500 µs“.</text>
<text x="92.00" y="197.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >2.</text>
<text x="97.00" y="197.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Lehre A/B ausschneiden, am besten auf Karton kleben;</text>
<text x="92.00" y="201.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="201.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >A oder B – je nachdem, von welcher Seite du schaust.</text>
<text x="92.00" y="206.40" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >3.</text>
<text x="97.00" y="206.40" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Kreuz „Femur-Achse“ auf die Femur-Drehachse legen, rote</text>
<text x="92.00" y="211.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="211.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Linie parallel zur Körperebene (Unterseite/Coxa-Halter).</text>
<text x="92.00" y="215.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >4.</text>
<text x="97.00" y="215.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Femur-Horn auf den Zahn stecken, bei dem die Knie-Achse</text>
<text x="92.00" y="220.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="220.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >am nächsten am Kreuz „Knie-Achse“ liegt (1 Zahn ≈ 18°).</text>
<text x="92.00" y="224.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >5.</text>
<text x="97.00" y="224.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Tibia-Horn so, dass die Fußspitze auf der Marke liegt – bei</text>
<text x="92.00" y="229.40" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="229.40" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >richtiger Höhe also auf dem Tisch, 100 mm von der Coxa-Achse.</text>
<text x="92.00" y="234.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >6.</text>
<text x="97.00" y="234.00" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Coxa mit Lehre C: Bein in Montagerichtung (45° / 90°).</text>
<text x="92.00" y="238.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" >7.</text>
<text x="97.00" y="238.60" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Feinjustage je Servo im Rohmodus (±1 µs) bis alles</text>
<text x="92.00" y="243.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="243.20" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >deckungsgleich ist → „Aktuelle Stellung = Montagestellung“.</text>
<text x="92.00" y="247.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="bold" ></text>
<text x="97.00" y="247.80" font-size="2.8" text-anchor="start" fill="#222" font-weight="normal" >Je Bein zuerst Femur, dann Tibia. Details: docs/kalibrierung.md</text>
<text x="12.00" y="287.00" font-size="2.4" text-anchor="start" fill="#666" font-weight="normal" >Linien = Achslinien (Drehpunkt zu Drehpunkt), nicht Bauteilkanten. Erzeugt mit docs/montagelehre.py.</text>
