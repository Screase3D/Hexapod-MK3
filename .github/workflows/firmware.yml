# Baut die Firmware bei jedem Push/PR und stellt die Binärdateien als
# Artefakt bereit. firmware.factory.bin lässt sich ohne PlatformIO direkt
# im Browser flashen (siehe README, "Fertige Firmware flashen").
name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

# Ein neuer Push bricht den noch laufenden Build desselben Branches ab
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

# Kein Paket-Cache: die Toolchain (~4 GB entpackt) neu zu laden ist schneller
# als sie aus dem Actions-Cache wiederherzustellen.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      - name: Weboberfläche prüfen (JS-Syntax)
        run: node --check firmware/web/app.js

      - name: Kinematik- und Gang-Tests (PC)
        working-directory: firmware/test_host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I../src -I../include \
            kinematics_test.cpp ../src/kinematics/kinematics.cpp -o kin_test
          ./kin_test
          g++ -std=c++17 -Wall -Wextra -Werror -I../src -I../include \
            gait_test.cpp ../src/kinematics/gait.cpp ../src/kinematics/kinematics.cpp -o gait_test
          ./gait_test

      - name: Firmware bauen
        run: pio run -d firmware

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hexapod-firmware
          path: |
            firmware/.pio/build/hexapod/firmware.factory.bin
            firmware/.pio/build/hexapod/firmware.bin
            firmware/.pio/build/hexapod/bootloader.bin
            firmware/.pio/build/hexapod/partitions.bin
          if-no-files-found: error
