# Baut die Firmware bei jedem Push/PR und stellt die Binärdateien als
# Artefakt bereit. firmware.factory.bin lässt sich ohne PlatformIO direkt
# im Browser flashen (siehe README, "Fertige Firmware flashen").
name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO-Pakete aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      - name: Weboberfläche prüfen (JS-Syntax)
        run: node --check firmware/web/app.js

      - name: Firmware bauen
        run: pio run -d firmware

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: hexapod-firmware
          path: |
            firmware/.pio/build/hexapod/firmware.factory.bin
            firmware/.pio/build/hexapod/firmware.bin
            firmware/.pio/build/hexapod/bootloader.bin
            firmware/.pio/build/hexapod/partitions.bin
          if-no-files-found: error
